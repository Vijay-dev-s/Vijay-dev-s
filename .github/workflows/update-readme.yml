name: Update profile README (theme rotation)

# This workflow lives INSIDE the Vijay-dev-s repo, which is itself the
# generator's ROOT — scripts/generate.js writes README.md and assets/hero/
# straight to this repo's root. There is no nested folder here.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'config/themes.json'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate current-theme README
        run: node scripts/generate.js

      - name: Commit and push if changed
        run: |
          git config user.name "theme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md assets/hero/*.svg
          if git diff --cached --quiet; then
            echo "No visual change — nothing to commit."
          else
            git commit -m "chore: rotate profile theme [skip ci]"
            git push
          fi
